# Site estático de marca: sem indexação e fechado para robôs (inclusive de IA), aberto para pessoas.
map $http_user_agent $robo {
    default 0;
    "~*(bot|crawl|spider|slurp|scrapy|python-requests|headlesschrome|gptbot|chatgpt|oai-searchbot|ccbot|claude|anthropic|perplexity|bytespider|amazonbot|applebot|google-extended|googleother|meta-externalagent|facebookexternalhit|diffbot|ahrefs|semrush|mj12|dotbot|petalbot|yandex|baiduspider|ia_archiver|archive\.org|dataforseo|imagesift|omgili|timpibot|youbot|cohere)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/html text/css text/plain text/xml application/javascript application/json image/svg+xml;
    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # robots.txt fica acessível para os robôs educados lerem o Disallow
    location = /robots.txt { try_files $uri =404; }

    location / {
        if ($robo) { return 403; }
        try_files $uri $uri/ =404;
        expires 10m;
    }
}
